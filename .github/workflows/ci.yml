name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # setup-python has no 3.9 builds for the ubuntu-26.04 latest image.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 is roughly what older UGOS images ship; 3.12 is current.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile (syntax check)
        run: python -m compileall -q ugos-llm.py openai-bridge/proxy.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI help works without arguments to the network
        run: |
          python ugos-llm.py --help > /dev/null
          for c in check install list test doctor ui runtime remove; do
            python ugos-llm.py "$c" --help > /dev/null
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: bash -n scripts/build-runtime.sh scripts/build-runtime-vulkan.sh
      - name: Shellcheck
        run: shellcheck scripts/build-runtime.sh scripts/build-runtime-vulkan.sh
      - run: pip install ruff==0.17.2
      - run: ruff check --select E,F,W --line-length 100 ugos-llm.py openai-bridge/proxy.py tests
